[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "library-hiroba"
dynamic = ["version"]
description = "Google Colab と PyHiroba で同じコードが動く、教育向けの UI と AI のライブラリ"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Takehiro Funakoshi" }]
keywords = ["jupyter", "colab", "education", "ui", "notebook", "pyodide", "widgets", "html", "llm"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Education",
  "Natural Language :: Japanese",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Framework :: Jupyter",
  "Topic :: Education",
  "Topic :: Education :: Computer Aided Instruction (CAI)",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/funakoshi-takehiro/ui-hiroba"
Repository = "https://github.com/funakoshi-takehiro/ui-hiroba"
Issues = "https://github.com/funakoshi-takehiro/ui-hiroba/issues"
Changelog = "https://github.com/funakoshi-takehiro/ui-hiroba/releases"

[project.optional-dependencies]
# ai は Colab で言語モデルを動かすときだけ必要。既定では入れない
# （ui だけを使う環境に torch を持ち込まないため）
#
# 下限は当てずっぽうではなく、一覧に載せたモデルが要求する版：
#   transformers>=4.57 … MODELS の qwen35_08 は Qwen3.5（model_type は qwen3_5）。
#     本家 config.json の transformers_version が 4.57.0.dev0 で、4.57.0 が
#     これを読める最初の安定版。下限が無いと、古い版が入っている環境で
#     KeyError: 'qwen3_5' という原因の分からない形で落ちる
#     （qwen3_06 / qwen3_17 の Qwen3 は 4.51 以降。厳しいほうに合わせる）
#   torch>=2.0 … transformers 4.51 自身が要求する下限
ai = ["transformers>=4.57", "torch>=2.0"]
dev = ["pytest", "ruff>=0.16", "build", "twine", "nbformat"]
gallery = ["playwright"]

[tool.hatch.version]
path = "src/library_hiroba/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/library_hiroba"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
# ruff は版が上がると既定の規則セットが変わるため、使う規則を明示しておく
# （明示しないと、こちらのコードを変えていないのに CI だけ落ちることがある）
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "BLE", "RUF"]
# RUF001-003 は全角括弧などを「紛らわしい文字」として警告するが、
# このプロジェクトは日本語で書くため全角の使用は意図的
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
