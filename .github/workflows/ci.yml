name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:

# 読むだけでよい。既定のままだと、ここで動くものに書き込み権限まで渡ることがある
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # 開発用の依存は pyproject の dev extra に集約し、手元と CI で同じものを使う
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests tools
      - name: Test
        run: pytest -q

  # 上の job は dev extra しか入れないため torch を要る検査（Colab 経路の平均
  # プーリング・埋め込みの鍵・二重読み込み）が黙って skip されていた。緑のまま
  # 一度も動いていなかったので、実際に入れて回す job を分けて置く。
  # HIROBA_REQUIRE_AI=1 は「torch が無いなら skip ではなく失敗」の指定。
  # これが無いと、依存が抜けた日にまた静かに skip へ戻る。
  ai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # torch は CPU 版で足りる（GPU 版は数 GB ある）。--extra-index-url ではなく
      # 先に torch だけ専用の index から入れる。両方を同時に見せると pip は版の
      # 大きいほうを選ぶため、同名パッケージの取り違えが起こりうる
      - name: Install torch (CPU)
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install
        run: python -m pip install -e ".[dev,ai]"
      - name: Test
        env:
          HIROBA_REQUIRE_AI: "1"
        run: pytest -q
