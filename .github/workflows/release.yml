name: Release to PyPI

on:
  push:
    tags: ["v*"]

# 既定を最小にして、必要な権限は使う job だけに書く（下の publish の id-token）
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # タグ v0.1.1 なのに __version__ が 0.1.0 のまま、という取り違えを
      # ここで止める（そのまま進むと PyPI で「公開済み」エラーになり原因が分かりにくい）
      - name: Check tag matches __version__
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(python -c 'import re,pathlib;
          print(re.search(r"__version__ = \"([^\"]+)\"",
          pathlib.Path("src/library_hiroba/__init__.py").read_text()).group(1))')"
          echo "tag=$TAG  __version__=$VERSION"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::タグ v$TAG と __version__ $VERSION が一致しません。" \
                 "src/library_hiroba/__init__.py を更新するか、タグを打ち直してください。"
            exit 1
          fi

      # 壊れたものを公開しないよう、リリース時にもテストを通す。
      # ai extra まで入れるのは、Colab 経路の検査が torch を要るため。ここを
      # dev だけにすると、その検査が skip されたまま公開まで進む
      - name: Test
        env:
          HIROBA_REQUIRE_AI: "1"
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev,ai]"
          ruff check src tests tools
          pytest -q

      - name: Build sdist and wheel
        run: |
          python -m build
          twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/library-hiroba/
    permissions:
      contents: read
      id-token: write  # PyPI Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
